name: Backend checks
on:
  push:
    paths: ['backend/**', 'scripts/backend.sh', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'scripts/backend.sh', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit and PostgreSQL integration tests
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify
